# Sunder — iOS verification and TestFlight release.
#
# Two jobs, deliberately split by what they need:
#
#   verify      Linux. Tests, type-check, brand-asset drift, web build. Needs no
#               Apple account, so it guards the project from day one.
#   ios-build   macOS. Compiles the real iOS app unsigned and proves the web
#               build landed inside the bundle. Still needs no Apple account.
#   testflight  macOS, manual only. Signs, archives, exports, validates, uploads.
#               Dormant until the seven secrets in docs/IOS-CI-SETUP.md exist.
#
# The Linux/macOS split is not cosmetic: macOS runner minutes bill at ten times
# the Linux rate on private repositories, and only the last two steps actually
# need a Mac.

name: iOS

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "scripts/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "scripts/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 1.0.0. Blank keeps whatever the project declares."
        required: false
        type: string

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # verify — no Apple account required
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # server/stripe.ts constructs the Stripe client at module load, and the
      # SDK throws on an empty key — so five server test files fail to import
      # without one, even though none of them talk to Stripe. A dummy value is
      # enough; the tests stub the network. (Worth fixing at the source one day
      # by constructing the client lazily.)
      - name: Tests
        env:
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
        run: pnpm test

      - name: Type-check
        run: pnpm check

      # The icon and splash are rendered from the same procedural sigil as the
      # in-app brand mark, so the home screen and the game cannot drift apart —
      # but only if the committed PNGs really are what the source renders today.
      - name: Install Chromium for asset rendering
        run: pnpm exec playwright install --with-deps chromium

      - name: Brand assets match the sigil source
        run: |
          pnpm icons
          if ! git diff --quiet -- ios/App/App/Assets.xcassets client/public; then
            echo "::error::The committed icon/splash no longer match a fresh render of the sigil source."
            echo "Run 'pnpm icons' locally and commit the result. Files that changed:"
            git diff --stat -- ios/App/App/Assets.xcassets client/public
            exit 1
          fi
          echo "Committed assets are byte-identical to a fresh render."

      - name: Build web
        run: pnpm build

      - name: The web build exists where Capacitor expects it
        run: |
          test -f dist/public/index.html \
            || { echo "::error::dist/public/index.html missing — capacitor.config.ts points webDir at dist/public"; exit 1; }
          echo "dist/public/index.html present ($(du -sh dist/public | cut -f1) total)."

  # ---------------------------------------------------------------------------
  # ios-build — compiles the real app, still no Apple account required
  # ---------------------------------------------------------------------------
  ios-build:
    name: Build unsigned
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web and sync into the iOS project
        run: |
          pnpm build
          npx cap sync ios

      # capacitor.config.json and config.xml are git-ignored and generated by
      # `cap sync`; the Xcode project lists both as build resources, so the sync
      # above is what makes this compile at all.
      - name: Compile (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      # `public` is a folder reference in the Resources build phase, so a failed
      # or skipped `cap sync` produces an app that launches to a blank web view
      # instead of failing the build. Assert it rather than trust it.
      - name: The web build really landed inside App.app
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name 'App.app' -type d | head -1)
          test -n "$APP" || { echo "::error::App.app not found under build/Build/Products"; exit 1; }
          echo "Bundle: $APP"
          test -f "$APP/public/index.html" \
            || { echo "::error::$APP/public/index.html missing — cap sync did not copy dist/public into the bundle"; exit 1; }
          test -f "$APP/capacitor.config.json" \
            || { echo "::error::$APP/capacitor.config.json missing"; exit 1; }
          # A bundle carrying only index.html would still pass the check above.
          COUNT=$(find "$APP/public" -type f | wc -l | tr -d ' ')
          test "$COUNT" -gt 5 \
            || { echo "::error::only $COUNT files under $APP/public — the web build looks truncated"; exit 1; }
          echo "$COUNT files under public/, index.html present."

  # ---------------------------------------------------------------------------
  # testflight — manual, requires the seven secrets
  # ---------------------------------------------------------------------------
  testflight:
    name: TestFlight
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [verify, ios-build]
    environment: app-store
    timeout-minutes: 60
    steps:
      # Fail in ten seconds with the names of what is missing, rather than
      # twenty minutes later inside xcodebuild.
      - name: Check the secrets exist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          MISSING=""
          for NAME in APPLE_TEAM_ID IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD \
                      IOS_PROVISIONING_PROFILE APP_STORE_CONNECT_KEY_ID \
                      APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_P8; do
            [ -n "${!NAME}" ] || MISSING="$MISSING $NAME"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secrets:$MISSING"
            echo "See docs/IOS-CI-SETUP.md — every one of them is created there."
            exit 1
          fi
          echo "All seven secrets are present."

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web and sync into the iOS project
        run: |
          pnpm build
          npx cap sync ios

      # A throwaway keychain, not the login keychain: it is created here,
      # deleted in the cleanup step, and never unlocked for anything else.
      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/sunder-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          # Without this, codesign prompts for keychain access and the runner,
          # having no UI, fails with errSecInternalComponent.
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c '"')
          test "$IDENTITY" -gt 0 \
            || { echo "::error::No codesigning identity in the .p12 — it is probably missing the private key (see step 3 of docs/IOS-CI-SETUP.md)"; exit 1; }
          security find-identity -v -p codesigning "$KEYCHAIN"

      # The profile is the source of truth for the bundle id, the team and the
      # profile name. Reading them out of it means the Xcode project never has
      # to be edited to match whatever was registered on the developer portal.
      - name: Install the provisioning profile and read what it says
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"

          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          # application-identifier is "TEAMID.com.example.app" — strip the prefix.
          BUNDLE_ID="${APP_ID#*.}"

          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/$UUID.mobileprovision"

          case "$BUNDLE_ID" in
            *\*) echo "::error::The profile is a wildcard ($BUNDLE_ID). App Store distribution needs an explicit App ID — see step 2 of docs/IOS-CI-SETUP.md"; exit 1 ;;
          esac

          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "Profile '$NAME' ($UUID) signs $BUNDLE_ID"

      - name: Render ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          OUT="$RUNNER_TEMP/ExportOptions.plist"
          cp ios/App/ExportOptions.plist "$OUT"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$OUT"
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles:__BUNDLE_ID__" "$OUT"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" "$OUT"
          echo "EXPORT_OPTIONS=$OUT" >> "$GITHUB_ENV"
          cat "$OUT"

      # The build number comes from the run number, which only ever increases.
      # A reused build number is the most common first-submission rejection.
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          VERSION_ARG=""
          if [ -n "${{ inputs.version }}" ]; then
            VERSION_ARG="MARKETING_VERSION=${{ inputs.version }}"
            echo "Marketing version overridden to ${{ inputs.version }}"
          fi

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $VERSION_ARG \
            archive

      - name: The archive carries the web build
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          test -f "$APP/public/index.html" \
            || { echo "::error::the archive has no web build inside it"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

      - name: Export .ipa
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$EXPORT_OPTIONS"
          ls -lh "$RUNNER_TEMP/export"

      - name: Authenticate to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          # altool looks for the key here by convention; passing a path is not
          # supported for --apiKey.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"

      - name: Validate
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "::error::no .ipa was exported"; exit 1; }
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It appears in TestFlight after Apple finishes processing."

      # Reading these is usually faster than scrolling the console output.
      - name: Keep the .ipa and the export logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/export/**
            ${{ runner.temp }}/App.xcarchive/Info.plist

      - name: Delete the signing keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
